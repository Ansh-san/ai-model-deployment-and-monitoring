version: "3.9"

services:
  aircast-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aircast-india:1.0.0
    container_name: aircast-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs        # persist logs outside the container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: lightweight Prometheus-compatible metrics scraper
  # Uncomment to add Prometheus + Grafana in production
  # prometheus:
  #   image: prom/prometheus:v2.48.0
  #   ports: ["9090:9090"]
  #   volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
  #   depends_on: [aircast-api]
